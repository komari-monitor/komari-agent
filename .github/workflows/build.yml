name: Build on Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout protocol repo as sibling (go.mod replace target)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/komari-protocol
          path: komari-protocol

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.sha }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          go build -trimpath -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o $BINARY_NAME

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout protocol repo as sibling (go.mod replace target)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/komari-protocol
          path: komari-protocol
        with:
          path: komari-agent

      - name: Checkout protocol repo as sibling (go.mod replace target)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/komari-protocol
          path: komari-protocol

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: go vet
        working-directory: komari-agent
        run: go vet ./...

      - name: go test
        working-directory: komari-agent
        run: go test -count=1 ./...
